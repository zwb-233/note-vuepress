
name: 部署文档

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-from-note-repo]

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          submodules: true
          token: ${{ secrets.BLOG_TOKEN }}

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8


      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 获取 pnpm store 真实路径并预创建
        run: |
          STORE=$(pnpm store path --silent)
          echo "pnpm store path = $STORE"
          mkdir -p "$STORE"

      - name: 安装依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: 更新所有子模块到最新提交
        run: |
          git submodule update --remote --merge

#      - name: 检查子模块是否有更新
#        id: "check_submodule_change"
